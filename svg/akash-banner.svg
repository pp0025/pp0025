<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020024"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="24" />

  <!-- Decorative circles -->
  <circle cx="1050" cy="80" r="70" fill="#0f172a" opacity="0.7"/>
  <circle cx="1040" cy="70" r="40" fill="url(#accentGrad)" opacity="0.9"/>

  <!-- Left accent bar -->
  <rect x="80" y="80" width="6" height="240" fill="url(#accentGrad)" rx="3"/>

  <!-- Main Text -->
  <text x="110" y="150" fill="#e5e7eb"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="40" font-weight="700">
    AKASH ROY
  </text>

  <text x="110" y="195" fill="#9ca3af"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="22">
    Embedded Systems &amp; IoT Developer
  </text>

  <text x="110" y="235" fill="#6b7280"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="16">
    ESP32 · Arduino · Raspberry Pi Pico · C/C++ · IoT Prototyping · Electronics
  </text>

  <!-- Bottom tags -->
  <!-- Left pill -->
  <rect x="110" y="270" rx="16" ry="16" width="340" height="36"
        fill="#020617" opacity="0.9" />
  <text x="125" y="293" fill="#e5e7eb"
        font-family="system-ui, 'Segoe UI', sans-serif"
        font-size="14">
    ⚡ Smart Automation &amp; Hardware Projects
  </text>

  <!-- Right pill -->
  <rect x="480" y="270" rx="16" ry="16" width="260" height="36"
        fill="#020617" opacity="0.9" />
  <text x="495" y="293" fill="#e5e7eb"
        font-family="system-ui, 'Segoe UI', sans-serif"
        font-size="14">
    📡 Wi-Fi · Bluetooth · Cloud Integration
  </text>
</svg>
